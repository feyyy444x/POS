name: Security smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/nexapos-operations-bundle-v2]

permissions:
  contents: read

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run static security regression checks
        run: node --test tests/security-smoke.test.mjs
      - name: Build production bundle
        run: npm run build
