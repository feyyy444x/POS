name: NexaPos branch validation

on:
  push:
    branches:
      - nexapos/consolidated-pr-22
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/nexapos-branch-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexapos-branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install dependencies and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexapos-branch-dist
          path: dist/
          if-no-files-found: error
          retention-days: 5
